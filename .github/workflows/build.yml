name: Windows build, lint and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install PowerShell linter
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Repository PSGallery -Scope CurrentUser -Force
      - name: Lint C# formatting and PowerShell
        shell: powershell
        run: .\scripts\lint.ps1
      - name: Ensure VSTO build tools
        shell: powershell
        run: .\scripts\install-build-tools.ps1
      - name: Run regression tests
        shell: powershell
        run: .\scripts\test.ps1
      - name: Build signed package with C# static analysis
        shell: powershell
        run: |
          $thumbprint = .\scripts\new-dev-certificate.ps1
          try {
            .\scripts\build.ps1 -CertificateThumbprint $thumbprint -Publish
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
      - name: Upload development package (not production signed)
        uses: actions/upload-artifact@v4
        with:
          name: RecipientConfirm-development
          path: artifacts/publish/
          if-no-files-found: error
