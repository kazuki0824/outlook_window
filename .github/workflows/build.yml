name: dotnet CLI compatibility probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Probe dotnet CLI with and without installed VSTO targets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/probe | Out-Null
          dotnet --info
          $thumbprint = .\scripts\new-dev-certificate.ps1
          try {
            $project = 'src/RecipientConfirm/RecipientConfirm.csproj'
            dotnet build $project --configuration Release "-p:ManifestCertificateThumbprint=$thumbprint" 2>&1 | Tee-Object artifacts/probe/sdk-only.log
            "SDK-only exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/sdk-only.log
            . .\scripts\BuildEnvironment.ps1
            $build = Get-BuildEnvironment
            $pia = Get-OfficePiaPath
            $ErrorActionPreference = 'Continue'
            dotnet build $project --configuration Release "-p:ManifestCertificateThumbprint=$thumbprint" "-p:VSToolsPath=$($build.VSToolsPath)" "-p:OfficePiaPath=$pia" 2>&1 | Tee-Object artifacts/probe/with-vsto-targets.log
            "With VSTO targets exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/with-vsto-targets.log
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
          # This job records compatibility results; it is not a build acceptance check.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-compatibility-evidence
          path: artifacts/probe/
          if-no-files-found: error
