name: dotnet CLI compatibility probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Probe dotnet CLI with and without installed VSTO targets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force artifacts/probe | Out-Null
          dotnet --info
          $thumbprint = .\scripts\new-dev-certificate.ps1
          try {
            $project = 'src/RecipientConfirm/RecipientConfirm.csproj'
            dotnet build $project --configuration Release "-p:ManifestCertificateThumbprint=$thumbprint" 2>&1 | Tee-Object artifacts/probe/sdk-only.log
            "SDK-only exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/sdk-only.log
            . .\scripts\BuildEnvironment.ps1
            $build = Get-BuildEnvironment
            $pia = Get-OfficePiaPath
            $ErrorActionPreference = 'Continue'
            dotnet build $project --configuration Release "-p:ManifestCertificateThumbprint=$thumbprint" "-p:VSToolsPath=$($build.VSToolsPath)" "-p:OfficePiaPath=$pia" 2>&1 | Tee-Object artifacts/probe/with-vsto-targets.log
            "With VSTO targets exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/with-vsto-targets.log
            $vs = (Resolve-Path (Join-Path $build.VSToolsPath '..\..\..\..')).Path
            $references = '{HintPathFromItem}%3B{TargetFrameworkDirectory}%3B' + "$vs\Common7\IDE\ReferenceAssemblies\v4.0%3B$vs\Common7\IDE\PublicAssemblies"
            dotnet build $project --configuration Release "-p:ManifestCertificateThumbprint=$thumbprint" "-p:VSToolsPath=$($build.VSToolsPath)" "-p:OfficePiaPath=$pia" "-p:AssemblySearchPaths=$references" 2>&1 | Tee-Object artifacts/probe/with-vsto-references.log
            "With VSTO references exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/with-vsto-references.log
            [xml]$source = Get-Content $project
            $xmlns = 'http://schemas.microsoft.com/developer/msbuild/2003'
            [xml]$fixes = '<Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003"><ItemGroup /></Project>'
            $items = $fixes.DocumentElement.FirstChild
            foreach ($reference in $source.Project.ItemGroup.Reference) {
              $identity = $reference.Include
              $name = ($identity -split ',')[0]
              if ($name -like 'Microsoft.Office.Tools*' -or $name -like 'Microsoft.VisualStudio.Tools*' -or $name -eq 'stdole') {
                $directory = if ($name -eq 'stdole') { "$vs\Common7\IDE\PublicAssemblies" } else { "$vs\Common7\IDE\ReferenceAssemblies\v4.0" }
                $dll = Join-Path $directory "$name.dll"
                if (-not (Test-Path $dll)) { throw "Probe reference does not exist: $dll" }
                $entry = $fixes.CreateElement('Reference', $xmlns)
                $entry.SetAttribute('Update', $identity)
                $hint = $fixes.CreateElement('HintPath', $xmlns)
                $hint.InnerText = $dll
                $null = $entry.AppendChild($hint)
                $null = $items.AppendChild($entry)
              }
            }
            $fixPath = Join-Path $PWD 'artifacts\probe\references.targets'
            $fixes.Save($fixPath)
            dotnet build $project --configuration Release "-p:ManifestCertificateThumbprint=$thumbprint" "-p:VSToolsPath=$($build.VSToolsPath)" "-p:OfficePiaPath=$pia" "-p:CustomAfterMicrosoftCommonTargets=$fixPath" 2>&1 | Tee-Object artifacts/probe/with-hintpaths.log
            "With explicit HintPaths exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/with-hintpaths.log
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
          # This job records compatibility results; it is not a build acceptance check.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-compatibility-evidence
          path: artifacts/probe/
          if-no-files-found: error
