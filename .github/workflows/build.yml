name: Windows build, lint and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Install PowerShell linter
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Repository PSGallery -Scope CurrentUser -Force
      - name: Lint C# formatting and PowerShell
        run: .\scripts\lint.ps1
      - name: Run unit tests with dotnet CLI
        run: dotnet run --project tests/RecipientConfirm.Tests/RecipientConfirm.Tests.csproj --configuration Release
      - name: Build and publish VSTO package with static analysis
        run: |
          $thumbprint = .\scripts\new-dev-certificate.ps1
          try {
            $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\'
            msbuild src/RecipientConfirm/RecipientConfirm.csproj /restore /t:Publish /p:Configuration=Release "/p:ManifestCertificateThumbprint=$thumbprint" "/p:PublishDir=$publishDir"
            if ($LASTEXITCODE -ne 0) { throw 'VSTO build/publish failed.' }
            if (-not (Test-Path artifacts/publish/RecipientConfirm.vsto) -or
                -not (Get-ChildItem artifacts/publish -Recurse -Filter RecipientConfirm.dll.manifest) -or
                -not (Get-ChildItem artifacts/publish -Recurse -Filter RecipientConfirm.dll.deploy)) {
              throw 'VSTO deployment files are incomplete.'
            }
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
      - name: Upload development package (not production signed)
        uses: actions/upload-artifact@v4
        with:
          name: RecipientConfirm-development
          path: artifacts/publish/
          if-no-files-found: error
  dotnet-probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Diagnose VSTO task dependencies and dotnet Publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/probe | Out-Null
          $vs = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $vstools = "$vs\MSBuild\Microsoft\VisualStudio\v17.0"
          $office = "$vstools\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"
          Get-Content $office | Tee-Object artifacts/probe/office-targets.txt
          $taskDlls = @(Get-ChildItem $vs -Recurse -Filter '*BuildTasks*.dll' -ErrorAction SilentlyContinue | Where-Object FullName -Match 'Office|Application')
          $taskDlls | Select-Object FullName | Format-List
          $deps = @(Get-ChildItem "$env:windir\Microsoft.NET\assembly" -Recurse -Filter '*.dll' | Where-Object Name -Match '^Microsoft\.(VisualStudio\.Tools|Office\.Tools)')
          $deps | Select-Object FullName | Format-List
          # Disposable runner only: test normal assembly probing beside each VSTO task.
          foreach ($task in $taskDlls) {
            foreach ($dep in $deps) {
              $dest = Join-Path $task.DirectoryName $dep.Name
              if (-not (Test-Path $dest)) { Copy-Item $dep.FullName $dest }
            }
          }
          $project = 'src/RecipientConfirm/RecipientConfirm.csproj'
          [xml]$source = Get-Content $project
          $xmlns = 'http://schemas.microsoft.com/developer/msbuild/2003'
          [xml]$fixes = '<Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003"><ItemGroup /></Project>'
          $items = $fixes.DocumentElement.FirstChild
          foreach ($reference in $source.SelectNodes("//*[local-name()='Reference']")) {
            $identity = $reference.Include
            $name = ($identity -split ',')[0]
            if ($name -like 'Microsoft.Office.Tools*' -or $name -like 'Microsoft.VisualStudio.Tools*' -or $name -eq 'stdole') {
              $directory = if ($name -eq 'stdole') { "$vs\Common7\IDE\PublicAssemblies" } else { "$vs\Common7\IDE\ReferenceAssemblies\v4.0" }
              $entry = $fixes.CreateElement('Reference', $xmlns)
              $entry.SetAttribute('Update', $identity)
              $hint = $fixes.CreateElement('HintPath', $xmlns)
              $hint.InnerText = Join-Path $directory "$name.dll"
              $null = $entry.AppendChild($hint)
              $null = $items.AppendChild($entry)
            }
          }
          $fixPath = Join-Path $PWD 'artifacts\probe\references.targets'
          $fixes.Save($fixPath)
          $thumbprint = .\scripts\new-dev-certificate.ps1
          try {
            $pia = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA\Office15"
            $publishDir = Join-Path $PWD 'artifacts\probe\publish\'
            $ErrorActionPreference = 'Continue'
            dotnet publish $project --configuration Release "-p:VSToolsPath=$vstools" "-p:OfficePiaPath=$pia" "-p:CustomAfterMicrosoftCommonTargets=$fixPath" "-p:ManifestCertificateThumbprint=$thumbprint" "-p:PublishDir=$publishDir" 2>&1 | Tee-Object artifacts/probe/publish.log
            "dotnet Publish exit code: $LASTEXITCODE" | Tee-Object -Append artifacts/probe/publish.log
          } finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
          # Expected failures are evidence, not acceptance of the product build.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-task-dependency-evidence
          path: artifacts/probe/
          if-no-files-found: error
